<html>
  <head>
    <title>Unblocked Games Menu - Created By easy-123456789 on github - Enjoy!</title>
    <style>
      div {
        background: linear-gradient(white, black);
        margin: 5px;
        padding: 5px;
        border-radius: 5px;
      }
      div :not(.description) {
        background: linear-gradient(white, blue);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      div {
        font: 20px 'DM Mono', 'Courier New', monospace;
      }
      .gamelink {
        text-decoration: wavy underline;
        border-radius: 10px;
        background: linear-gradient(black, blue);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        padding: 10px;
        font-size: 50px;
      }
      .description {
        color: rgb(44,255,5);
        padding: 5px;
        border-radius: 5px;
      }
      p:not(.description){
        background-color: blue;
        border-radius: 5px;
        padding: 5px;
        margin: 0px;
      }
      body {
        padding: 0px;
        background: linear-gradient(#e66465, #9198e5);
      }
      .hidden {
        filter: blur(10px)
      }
    </style>
  </head>
  <body>
    <div id="ragdollfloat">
      <a href="src/ragdoll float/index.html" class="gamelink">Ragdoll Float</a>
    
      <p  class="description">A game where you knock each other off the map, with ragdoll physics.</p>
      <p>Gameplay type: 2-player competitive.</p>
    </div>
    <div id="retrobowl">
      <a href="src/retrobowl.html" class="gamelink">Retro Bowl</a>
    
      <p  class="description">A Football game where you battle cpus and manage your team.</p>
      <p>Gameplay type: Sports, 1 player.</p>
    </div>
    <script>
      const gameCards = document.querySelectorAll("div");
      for (const card of gameCards) {
        card.addEventListener("mouseover", () => card.classList.remove("hidden"));
        card.addEventListener("mouseout", () => card.classList.add("hidden"));
      }
      document.addEventListener("keydown", (e) => {
        if(e.key === "p"){
          for(let o of gameCards){ o.classList.add("hidden");}
        }
      });
    </script>
  </body>
</html>
